spring:
  application:
    name: cineseekerr-arr
  http:
    client:
      factory: simple
      connect-timeout: 10s
      # Manual searches can fan out through Arr's configured indexers.
      read-timeout: 90s

cineseekerr:
  language: ${BOT_LANGUAGE:it}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    allowed-chat-ids: ${TELEGRAM_ALLOWED_CHAT_IDS:}
  tmdb:
    api-key: ${TMDB_API_KEY:}
    base-url: ${TMDB_BASE_URL:https://api.themoviedb.org/3}
    language: ${TMDB_LANGUAGE:}
  radarr:
    base-url: ${RADARR_URL:}
    api-key: ${RADARR_API_KEY:}
    quality-profile-id: ${RADARR_QUALITY_PROFILE_ID:}
    root-folder: ${RADARR_ROOT_FOLDER:}
  sonarr:
    base-url: ${SONARR_URL:}
    api-key: ${SONARR_API_KEY:}
    quality-profile-id: ${SONARR_QUALITY_PROFILE_ID:}
    root-folder: ${SONARR_ROOT_FOLDER:}
logging:
  level:
    com.cineseekerr.bot: INFO
