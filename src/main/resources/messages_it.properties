help=🍿 <b>CineSeekerr Arr</b>\nScrivimi un film o una serie: scegli una release manuale e Radarr/Sonarr la scaricherà, importerà e organizzerà.\n\n<b>Comandi:</b>\n/cerca &lt;titolo&gt;\n/film &lt;titolo&gt;\n/serie &lt;titolo&gt;\n/annulla — annulla l''operazione\n/stato — code di download e import\n/clear — rimuove i torrent completati mantenendo i dati\n/elimina — scegli un torrent completato e cancella i suoi dati
