cleanup.preview.clear=🧹 <b>Rimuovere da Transmission {0} torrent completati?</b>\nDimensione totale: <b>{1}</b>\n\nI dati scaricati resteranno sul disco. I download attivi non saranno toccati.\n
cleanup.preview.delete=⚠️ <b>ELIMINARE {0} torrent completati e i relativi dati?</b>\nDimensione totale: <b>{1}</b>\n\nVerranno cancellati solo i dati nella cartella download di Transmission. Le librerie Radarr/Sonarr resteranno intatte. I download attivi non saranno toccati.\n
cleanup.select.delete=🗑 <b>Quale risorsa vuoi eliminare?</b>\n\nSono disponibili {0} torrent completati — pagina {1}/{2}. Selezionane uno; nel passaggio successivo dovrai confermare.
cleanup.preview.delete.one=⚠️ <b>Confermi l''eliminazione?</b>\n\n<b>{0}</b>\nDimensione: <b>{1}</b>\n\nIl torrent e i suoi dati nella cartella download verranno cancellati. Le librerie Radarr/Sonarr non saranno modificate.
