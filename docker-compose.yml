services:
  cineseekerr-arr:
    build: .
    image: cineseekerr-arr:local
    container_name: cineseekerr-arr
    restart: unless-stopped
    environment:
      BOT_LANGUAGE: "it"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:?set in .env}"
      TELEGRAM_ALLOWED_CHAT_IDS: "${TELEGRAM_ALLOWED_CHAT_IDS:?set in .env}"
      TMDB_API_KEY: "${TMDB_API_KEY:?set in .env}"
      RADARR_URL: "http://radarr:7878"
      RADARR_API_KEY: "${RADARR_API_KEY:?set in .env}"
      RADARR_QUALITY_PROFILE_ID: "${RADARR_QUALITY_PROFILE_ID:?set in .env}"
      RADARR_ROOT_FOLDER: "${RADARR_ROOT_FOLDER:?set in .env}"
      SONARR_URL: "http://sonarr:8989"
      SONARR_API_KEY: "${SONARR_API_KEY:?set in .env}"
      SONARR_QUALITY_PROFILE_ID: "${SONARR_QUALITY_PROFILE_ID:?set in .env}"
      SONARR_ROOT_FOLDER: "${SONARR_ROOT_FOLDER:?set in .env}"
      TRANSMISSION_RPC_URL: "${TRANSMISSION_RPC_URL:-http://transmission:9091/transmission/rpc}"
      TRANSMISSION_USERNAME: "${TRANSMISSION_USERNAME:?set in .env}"
      TRANSMISSION_PASSWORD: "${TRANSMISSION_PASSWORD:?set in .env}"
      TRANSMISSION_ALLOWED_DOWNLOAD_DIRS: "${TRANSMISSION_ALLOWED_DOWNLOAD_DIRS:-/downloads/complete}"
    networks: [media]
networks:
  media:
    external: true
    name: "${ARR_NETWORK:?set to your existing Arr Docker network}"
